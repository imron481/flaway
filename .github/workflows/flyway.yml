# GitHub Actions Workflow for Flyway Database Migrations
# Oracle Database Configuration
#
# Required Secrets (set in GitHub > Settings > Secrets and variables > Actions):
# - FLYWAY_DB_HOST: Database host
# - FLYWAY_DB_PORT: Database port
# - FLYWAY_DB_SID: Oracle SID
# - FLYWAY_DB_USER: Database username
# - FLYWAY_DB_PASSWORD: Database password

name: Flyway Migration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  FLYWAY_VERSION: "10.0.0"

jobs:
  # ====================
  # VALIDATE & INFO
  # ====================
  flyway-validate:
    name: Validate Migrations
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Flyway Info
        uses: docker://flyway/flyway:10.0.0
        with:
          args: >-
            -url="jdbc:oracle:thin:@${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}:${{ secrets.FLYWAY_DB_SID }}"
            -user="${{ secrets.FLYWAY_DB_USER }}"
            -password="${{ secrets.FLYWAY_DB_PASSWORD }}"
            -locations="filesystem:./flyway/sql"
            -baselineOnMigrate=true
            info

      - name: Run Flyway Validate
        uses: docker://flyway/flyway:10.0.0
        with:
          args: >-
            -url="jdbc:oracle:thin:@${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}:${{ secrets.FLYWAY_DB_SID }}"
            -user="${{ secrets.FLYWAY_DB_USER }}"
            -password="${{ secrets.FLYWAY_DB_PASSWORD }}"
            -locations="filesystem:./flyway/sql"
            -baselineOnMigrate=true
            validate

  # ====================
  # MIGRATE - Development
  # ====================
  flyway-migrate-dev:
    name: Migrate Development
    runs-on: ubuntu-latest
    needs: flyway-validate
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Flyway Migrate
        uses: docker://flyway/flyway:10.0.0
        with:
          args: >-
            -url="jdbc:oracle:thin:@${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}:${{ secrets.FLYWAY_DB_SID }}"
            -user="${{ secrets.FLYWAY_DB_USER }}"
            -password="${{ secrets.FLYWAY_DB_PASSWORD }}"
            -locations="filesystem:./flyway/sql"
            -baselineOnMigrate=true
            -validateOnMigrate=true
            migrate

  # ====================
  # MIGRATE - Production (Manual)
  # ====================
  flyway-migrate-prod:
    name: Migrate Production
    runs-on: ubuntu-latest
    needs: flyway-validate
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Flyway Migrate
        uses: docker://flyway/flyway:10.0.0
        with:
          args: >-
            -url="jdbc:oracle:thin:@${{ secrets.FLYWAY_DB_HOST_PROD }}:${{ secrets.FLYWAY_DB_PORT_PROD }}:${{ secrets.FLYWAY_DB_SID_PROD }}"
            -user="${{ secrets.FLYWAY_DB_USER_PROD }}"
            -password="${{ secrets.FLYWAY_DB_PASSWORD_PROD }}"
            -locations="filesystem:./flyway/sql"
            -baselineOnMigrate=true
            -validateOnMigrate=true
            migrate
