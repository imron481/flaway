# GitHub Actions Workflow for Flyway Database Migrations
# Simple Version Selection

name: Flyway Migration

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pilih Versi Migration
        required: true
        default: all
        type: choice
        options:
          - all
          - v1
          - v2
          - info
          - clean

jobs:
  flyway-migrate:
    name: Run Flyway Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Selected Version
        run: echo "Selected Version - ${{ inputs.version }}"

      - name: Migrate ALL Versions
        if: ${{ inputs.version == 'all' }}
        uses: docker://flyway/flyway:10.0.0
        with:
          args: -url=jdbc:oracle:thin:@//${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}/${{ secrets.FLYWAY_DB_SERVICE }} -user=${{ secrets.FLYWAY_DB_USER }} -password=${{ secrets.FLYWAY_DB_PASSWORD }} -schemas=ntt_risk_modelling -locations=filesystem:./flyway/sql -baselineOnMigrate=true migrate

      - name: Migrate V1 Only
        if: ${{ inputs.version == 'v1' }}
        uses: docker://flyway/flyway:10.0.0
        with:
          args: -url=jdbc:oracle:thin:@//${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}/${{ secrets.FLYWAY_DB_SERVICE }} -user=${{ secrets.FLYWAY_DB_USER }} -password=${{ secrets.FLYWAY_DB_PASSWORD }} -schemas=ntt_risk_modelling -locations=filesystem:./flyway/sql -baselineOnMigrate=true -target=1 migrate

      - name: Migrate up to V2
        if: ${{ inputs.version == 'v2' }}
        uses: docker://flyway/flyway:10.0.0
        with:
          args: -url=jdbc:oracle:thin:@//${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}/${{ secrets.FLYWAY_DB_SERVICE }} -user=${{ secrets.FLYWAY_DB_USER }} -password=${{ secrets.FLYWAY_DB_PASSWORD }} -schemas=ntt_risk_modelling -locations=filesystem:./flyway/sql -baselineOnMigrate=true -target=2 migrate

      - name: Show Migration Info
        if: ${{ inputs.version == 'info' }}
        uses: docker://flyway/flyway:10.0.0
        with:
          args: -url=jdbc:oracle:thin:@//${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}/${{ secrets.FLYWAY_DB_SERVICE }} -user=${{ secrets.FLYWAY_DB_USER }} -password=${{ secrets.FLYWAY_DB_PASSWORD }} -schemas=ntt_risk_modelling -locations=filesystem:./flyway/sql info

      - name: Clean Database
        if: ${{ inputs.version == 'clean' }}
        uses: docker://flyway/flyway:10.0.0
        with:
          args: -url=jdbc:oracle:thin:@//${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}/${{ secrets.FLYWAY_DB_SERVICE }} -user=${{ secrets.FLYWAY_DB_USER }} -password=${{ secrets.FLYWAY_DB_PASSWORD }} -schemas=ntt_risk_modelling -cleanDisabled=false clean

      - name: Re-Migrate After Clean
        if: ${{ inputs.version == 'clean' }}
        uses: docker://flyway/flyway:10.0.0
        with:
          args: -url=jdbc:oracle:thin:@//${{ secrets.FLYWAY_DB_HOST }}:${{ secrets.FLYWAY_DB_PORT }}/${{ secrets.FLYWAY_DB_SERVICE }} -user=${{ secrets.FLYWAY_DB_USER }} -password=${{ secrets.FLYWAY_DB_PASSWORD }} -schemas=ntt_risk_modelling -locations=filesystem:./flyway/sql migrate

      - name: Done
        run: echo "Migration completed!"
