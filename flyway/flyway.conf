# Flyway Configuration for Oracle Database
# Note: Sensitive values should be set via environment variables or CI/CD variables
# DO NOT commit actual passwords to this file

# JDBC URL for Oracle Database (using SERVICE_NAME format)
# Format: jdbc:oracle:thin:@//HOST:PORT/SERVICE_NAME
flyway.url=jdbc:oracle:thin:@//${FLYWAY_DB_HOST}:${FLYWAY_DB_PORT}/${FLYWAY_DB_SERVICE}

# Database credentials (use environment variables)
flyway.user=${FLYWAY_DB_USER}
flyway.password=${FLYWAY_DB_PASSWORD}

# Schema to manage
flyway.schemas=NTT_RISK_MODELLING

# Location of SQL migration scripts
flyway.locations=filesystem:./sql

# Encoding
flyway.encoding=UTF-8

# Table to track migration history
flyway.table=flyway_schema_history

# Baseline settings
flyway.baselineOnMigrate=true
flyway.baselineVersion=0

# Validation settings
flyway.validateOnMigrate=true

# Placeholder settings
flyway.placeholderReplacement=true

# Oracle specific settings
flyway.oracleSqlplus=false
flyway.oracleSqlplusWarn=true

# Clean disabled for safety (enable only in dev if needed)
flyway.cleanDisabled=true

# Out of order migrations
flyway.outOfOrder=false

# Mixed migrations (versioned and repeatable)
flyway.mixed=false

# Group all pending migrations
flyway.group=false

# Validate migrations naming
flyway.validateMigrationNaming=true
