# GitLab CI/CD Pipeline for Flyway Database Migrations
# Oracle Database Configuration
# 
# Required CI/CD Variables (set in GitLab > Settings > CI/CD > Variables):
# - FLYWAY_DB_HOST: Database host
# - FLYWAY_DB_PORT: Database port
# - FLYWAY_DB_SID: Oracle SID
# - FLYWAY_DB_USER: Database username
# - FLYWAY_DB_PASSWORD: Database password (masked)

stages:
  - validate
  - migrate
  - info

variables:
  FLYWAY_VERSION: "10.0.0"
  FLYWAY_EDITION: "community"

# Default configurations
default:
  image: flyway/flyway:${FLYWAY_VERSION}
  before_script:
    - echo "Flyway Migration Pipeline Started"
    - echo "Target Database - Host:${FLYWAY_DB_HOST}, SID:${FLYWAY_DB_SID}"

# ====================
# VALIDATION STAGE
# ====================
flyway-validate:
  stage: validate
  script:
    - flyway 
      -url="jdbc:oracle:thin:@${FLYWAY_DB_HOST}:${FLYWAY_DB_PORT}:${FLYWAY_DB_SID}"
      -user="${FLYWAY_DB_USER}"
      -password="${FLYWAY_DB_PASSWORD}"
      -locations="filesystem:./flyway/sql"
      -baselineOnMigrate=true
      validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  tags:
    - docker

# ====================
# INFO STAGE
# ====================
flyway-info:
  stage: info
  script:
    - flyway 
      -url="jdbc:oracle:thin:@${FLYWAY_DB_HOST}:${FLYWAY_DB_PORT}:${FLYWAY_DB_SID}"
      -user="${FLYWAY_DB_USER}"
      -password="${FLYWAY_DB_PASSWORD}"
      -locations="filesystem:./flyway/sql"
      -baselineOnMigrate=true
      info
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  tags:
    - docker

# ====================
# MIGRATION STAGES
# ====================

# Development Migration
flyway-migrate-dev:
  stage: migrate
  script:
    - flyway 
      -url="jdbc:oracle:thin:@${FLYWAY_DB_HOST}:${FLYWAY_DB_PORT}:${FLYWAY_DB_SID}"
      -user="${FLYWAY_DB_USER}"
      -password="${FLYWAY_DB_PASSWORD}"
      -locations="filesystem:./flyway/sql"
      -baselineOnMigrate=true
      -validateOnMigrate=true
      migrate
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  allow_failure: false
  tags:
    - docker

# Staging Migration
flyway-migrate-staging:
  stage: migrate
  script:
    - flyway 
      -url="jdbc:oracle:thin:@${FLYWAY_DB_HOST_STAGING}:${FLYWAY_DB_PORT_STAGING}:${FLYWAY_DB_SID_STAGING}"
      -user="${FLYWAY_DB_USER_STAGING}"
      -password="${FLYWAY_DB_PASSWORD_STAGING}"
      -locations="filesystem:./flyway/sql"
      -baselineOnMigrate=true
      -validateOnMigrate=true
      migrate
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual
  allow_failure: false
  tags:
    - docker

# Production Migration
flyway-migrate-prod:
  stage: migrate
  script:
    - flyway 
      -url="jdbc:oracle:thin:@${FLYWAY_DB_HOST_PROD}:${FLYWAY_DB_PORT_PROD}:${FLYWAY_DB_SID_PROD}"
      -user="${FLYWAY_DB_USER_PROD}"
      -password="${FLYWAY_DB_PASSWORD_PROD}"
      -locations="filesystem:./flyway/sql"
      -baselineOnMigrate=true
      -validateOnMigrate=true
      migrate
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
  allow_failure: false
  tags:
    - docker

# ====================
# REPAIR STAGE (Manual)
# ====================
flyway-repair:
  stage: migrate
  script:
    - flyway 
      -url="jdbc:oracle:thin:@${FLYWAY_DB_HOST}:${FLYWAY_DB_PORT}:${FLYWAY_DB_SID}"
      -user="${FLYWAY_DB_USER}"
      -password="${FLYWAY_DB_PASSWORD}"
      -locations="filesystem:./flyway/sql"
      repair
  rules:
    - when: manual
  allow_failure: true
  tags:
    - docker
